name: Deploy Benchmark Brawl
# Every push to main, and every morning with fresh scores and prices.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write # only to save the daily schedule on its own branch; main is never pushed to
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Publishing starts only once the repository is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://w20labs.github.io/benchmark-brawl/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Each day's brawl is decided once and kept on the daily-schedule branch, so it never changes during the day.
      - name: Load the daily schedule
        run: git fetch origin daily-schedule && git show origin/daily-schedule:daily.json > data/daily-state.json || echo "No saved schedule yet"
      # Fresh data on every deploy. If a source is down or its data looks wrong (the build checks), the committed data is used.
      - name: Refresh scores and prices
        run: (npm run data && touch data/.fresh) || (echo "::warning::Data refresh failed; deploying the committed data" && git checkout -- data/brawl.json)
      - run: npm test
      - name: Save the daily schedule
        if: github.ref == 'refs/heads/main' && hashFiles('data/.fresh') != ''
        run: |
          node -e "const d=require('./data/brawl.json');require('fs').writeFileSync('/tmp/daily.json',JSON.stringify(d.daily,null,1)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify -q origin/daily-schedule; then git worktree add -B daily-schedule /tmp/schedule origin/daily-schedule; else git worktree add --orphan -b daily-schedule /tmp/schedule; fi
          cp /tmp/daily.json /tmp/schedule/daily.json
          cd /tmp/schedule && git add daily.json && (git diff --cached --quiet || (git commit -m "Daily schedule $(date -u +%F)" && git push origin daily-schedule))
      - run: npm run build -- "$SITE_URL"
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
