name: Deploy Benchmark Brawl
# Every push to main, and every morning with fresh scores and prices.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write # only to save the last good data on the data-state branch; main is never pushed to
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Publishing starts only once the repository is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://w20labs.github.io/benchmark-brawl/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # The last good data, with its daily schedule, is kept on the data-state branch (main is never pushed to).
      # Each refresh starts from it, so the checks compare against it and the schedule carries on; if a refresh fails,
      # it is what gets deployed, rather than the older copy committed on main.
      - name: Load the last good data
        run: (git fetch origin data-state && git show origin/data-state:brawl.json > /tmp/last.json && cp /tmp/last.json data/brawl.json) || echo "No saved data yet; starting from the committed copy"
      - name: Refresh scores and prices
        run: (npm run data && touch data/.fresh) || echo "::warning::Data refresh failed; deploying the last good data"
      - run: npm test
      - name: Save the data as the new last good
        if: github.ref == 'refs/heads/main' && hashFiles('data/.fresh') != ''
        run: |
          cp data/brawl.json /tmp/brawl.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify -q origin/data-state; then git worktree add -B data-state /tmp/state origin/data-state; else git worktree add --orphan -b data-state /tmp/state; fi
          cp /tmp/brawl.json /tmp/state/brawl.json
          cd /tmp/state && git add brawl.json && (git diff --cached --quiet || (git commit -m "Data $(date -u +%F)" && git push origin data-state))
      - run: npm run build -- "$SITE_URL"
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
